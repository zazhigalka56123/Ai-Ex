spring:
  r2dbc:
    url: "${NOTIFICATION_DATABASE_URL:r2dbc:postgresql://localhost:5434/notification}"
    username: "${NOTIFICATION_DATABASE_USER:notification}"
    password: "${NOTIFICATION_DATABASE_PASSWORD:notification}"
    pool:
      max-size: 10
  sql:
    init:
      mode: always

springdoc:
  paths-to-match: /api/**
