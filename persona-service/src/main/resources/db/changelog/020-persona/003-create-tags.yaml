databaseChangeLog:
  - changeSet:
      id: 020-003-create-tags
      author: persona
      changes:
        - createTable:
            schemaName: persona
            tableName: tags
            columns:
              - column: { name: id, type: bigint, autoIncrement: true, constraints: { primaryKey: true, primaryKeyName: pk_tags } }
              - column: { name: code, type: varchar(48), constraints: { nullable: false } }
              - column: { name: title, type: varchar(96), constraints: { nullable: false } }
        - addUniqueConstraint:
            schemaName: persona
            tableName: tags
            columnNames: code
            constraintName: uq_tags_code
        - sql:
            sql: >-
              ALTER TABLE persona.tags
                ADD CONSTRAINT ck_tags_code CHECK (code ~ '^[a-z0-9-]+$'),
                ADD CONSTRAINT ck_tags_title CHECK (length(trim(title)) > 0)
      rollback:
        - dropTable: { schemaName: persona, tableName: tags }
