databaseChangeLog:
  - changeSet:
      id: 020-002-create-persona-traits
      author: persona
      changes:
        - createTable:
            schemaName: persona
            tableName: persona_traits
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, primaryKeyName: pk_persona_traits } }
              - column: { name: persona_id, type: uuid, constraints: { nullable: false } }
              - column: { name: trait_key, type: varchar(64), constraints: { nullable: false } }
              - column: { name: trait_value, type: varchar(256), constraints: { nullable: false } }
              - column: { name: weight, type: "numeric(4,3)", constraints: { nullable: false } }
              - column: { name: source, type: varchar(24), constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableSchemaName: persona
            baseTableName: persona_traits
            baseColumnNames: persona_id
            referencedTableSchemaName: persona
            referencedTableName: personas
            referencedColumnNames: id
            constraintName: fk_persona_traits_persona
            onDelete: CASCADE
        - addUniqueConstraint:
            schemaName: persona
            tableName: persona_traits
            columnNames: persona_id, trait_key
            constraintName: uq_persona_traits_key
        - sql:
            sql: >-
              ALTER TABLE persona.persona_traits
                ADD CONSTRAINT ck_persona_traits_weight CHECK (weight BETWEEN 0 AND 1),
                ADD CONSTRAINT ck_persona_traits_source CHECK (source IN ('AUTO', 'MANUAL'))
      rollback:
        - dropTable: { schemaName: persona, tableName: persona_traits }
