spring:
  application:
    name: account-service
  main:
    # JPA остаётся, но HTTP обслуживает WebFlux на Netty; блокирующие вызовы уходят в JpaScheduler.
    web-application-type: reactive
  profiles:
    active: microservice
  config:
    import: configserver:${CONFIG_SERVER_URL:http://localhost:8888}
