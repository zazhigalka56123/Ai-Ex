databaseChangeLog:
  - changeSet:
      id: 040-002-create-messages
      author: dialog
      changes:
        - createTable:
            schemaName: dialog
            tableName: messages
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, primaryKeyName: pk_messages } }
              - column: { name: conversation_id, type: uuid, constraints: { nullable: false } }
              - column: { name: sender, type: varchar(24), constraints: { nullable: false } }
              - column: { name: body, type: text, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: agent_run_id, type: uuid }
              - column: { name: flagged, type: boolean, defaultValueBoolean: false, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableSchemaName: dialog
            baseTableName: messages
            baseColumnNames: conversation_id
            referencedTableSchemaName: dialog
            referencedTableName: conversations
            referencedColumnNames: id
            constraintName: fk_messages_conversation
            onDelete: CASCADE
        - sql:
            sql: >-
              ALTER TABLE dialog.messages
                ADD CONSTRAINT ck_messages_sender CHECK (sender IN ('USER', 'PERSONA')),
                ADD CONSTRAINT ck_messages_body_length CHECK (char_length(body) BETWEEN 1 AND 4000),
                ADD CONSTRAINT ck_messages_agent_run CHECK (sender = 'PERSONA' OR agent_run_id IS NULL)
        - sql:
            sql: CREATE INDEX ix_messages_conversation_created ON dialog.messages (conversation_id, created_at DESC, id DESC)
        - sql:
            sql: >-
              CREATE INDEX ix_messages_conversation_flagged ON dialog.messages (conversation_id, created_at DESC, id DESC)
              WHERE flagged
      rollback:
        - dropTable: { schemaName: dialog, tableName: messages }
