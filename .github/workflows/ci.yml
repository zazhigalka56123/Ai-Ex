name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint, test, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and verify
        run: ./gradlew build koverXmlReport koverHtmlReport --continue

      - name: Coverage summary
        if: always()
        run: |
          report=build/reports/kover/report.xml
          if [ -f "$report" ]; then
            python3 - "$report" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          line = next(c for c in root.findall("counter") if c.get("type") == "LINE")
          covered, missed = int(line.get("covered")), int(line.get("missed"))
          print(f"### Покрытие строк: {100 * covered / (covered + missed):.1f}% (порог 70%)")
          PY
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/reports/kover/
            **/build/reports/tests/
            **/build/reports/detekt/
          retention-days: 14

  compose-smoke:
    name: docker compose up на чистой машине
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Smoke checks
        run: |
          curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'
          curl -fsS http://localhost:8080/v3/api-docs/all > /dev/null
          curl -fsS -H 'X-User-Id: 00000000-0000-0000-0000-00000000a001' 'http://localhost:8080/api/v1/users?size=5' | grep -q admin@ai-ex.local

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color app

      - name: Tear down
        if: always()
        run: docker compose down -v
