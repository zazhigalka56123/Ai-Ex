databaseChangeLog:
  - changeSet:
      id: 020-006-create-persona-profile-versions
      author: persona
      changes:
        - createTable:
            schemaName: persona
            tableName: persona_profile_versions
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, primaryKeyName: pk_persona_profile_versions } }
              - column: { name: persona_id, type: uuid, constraints: { nullable: false } }
              - column: { name: version_no, type: int, constraints: { nullable: false } }
              - column: { name: system_prompt, type: text, constraints: { nullable: false } }
              - column: { name: style, type: jsonb, constraints: { nullable: false } }
              - column: { name: corpus_stats, type: jsonb, constraints: { nullable: false } }
              - column: { name: corpus_snapshot_id, type: uuid, constraints: { nullable: false } }
              - column: { name: active, type: boolean, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableSchemaName: persona
            baseTableName: persona_profile_versions
            baseColumnNames: persona_id
            referencedTableSchemaName: persona
            referencedTableName: personas
            referencedColumnNames: id
            constraintName: fk_profile_versions_persona
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableSchemaName: persona
            baseTableName: persona_profile_versions
            baseColumnNames: corpus_snapshot_id
            referencedTableSchemaName: persona
            referencedTableName: corpus_snapshots
            referencedColumnNames: id
            constraintName: fk_profile_versions_snapshot
        - addUniqueConstraint:
            schemaName: persona
            tableName: persona_profile_versions
            columnNames: persona_id, version_no
            constraintName: uq_profile_versions_no
        - sql:
            sql: >-
              ALTER TABLE persona.persona_profile_versions
                ADD CONSTRAINT ck_profile_versions_no CHECK (version_no > 0),
                ADD CONSTRAINT ck_profile_versions_prompt CHECK (length(system_prompt) > 0)
        - sql:
            sql: CREATE UNIQUE INDEX ux_profile_versions_active ON persona.persona_profile_versions (persona_id) WHERE active
        - createIndex:
            schemaName: persona
            tableName: persona_profile_versions
            indexName: ix_profile_versions_snapshot
            columns: [ { column: { name: corpus_snapshot_id } } ]
      rollback:
        - dropTable: { schemaName: persona, tableName: persona_profile_versions }
