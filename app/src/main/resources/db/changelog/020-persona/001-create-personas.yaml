databaseChangeLog:
  - changeSet:
      id: 020-001-create-personas
      author: persona
      changes:
        - createTable:
            schemaName: persona
            tableName: personas
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, primaryKeyName: pk_personas } }
              - column: { name: owner_id, type: uuid, constraints: { nullable: false } }
              - column: { name: name, type: varchar(64), constraints: { nullable: false } }
              - column: { name: relationship_kind, type: varchar(24), constraints: { nullable: false } }
              - column: { name: description, type: varchar(500) }
              - column: { name: status, type: varchar(24), constraints: { nullable: false } }
              - column: { name: active_profile_id, type: uuid }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: archived_at, type: timestamptz }
              - column: { name: version, type: bigint, constraints: { nullable: false } }
        - sql:
            sql: >-
              ALTER TABLE persona.personas
                ADD CONSTRAINT ck_personas_status CHECK (status IN ('DRAFT', 'TRAINING', 'READY', 'ARCHIVED')),
                ADD CONSTRAINT ck_personas_relationship_kind CHECK (relationship_kind IN ('EX_PARTNER', 'EX_CRUSH', 'FRIEND', 'OTHER')),
                ADD CONSTRAINT ck_personas_name CHECK (length(trim(name)) > 0),
                ADD CONSTRAINT ck_personas_archived CHECK ((status = 'ARCHIVED') = (archived_at IS NOT NULL)),
                ADD CONSTRAINT ck_personas_archived_no_profile CHECK (status <> 'ARCHIVED' OR active_profile_id IS NULL)
        - sql:
            sql: CREATE INDEX ix_personas_owner_created ON persona.personas (owner_id, created_at DESC)
      rollback:
        - dropTable: { schemaName: persona, tableName: personas }
