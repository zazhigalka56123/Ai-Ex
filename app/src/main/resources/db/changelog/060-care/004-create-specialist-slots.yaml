databaseChangeLog:
  - changeSet:
      id: 060-004-create-specialist-slots
      author: care
      changes:
        - createTable:
            schemaName: care
            tableName: specialist_slots
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, primaryKeyName: pk_specialist_slots } }
              - column: { name: specialist_id, type: uuid, constraints: { nullable: false } }
              - column: { name: starts_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: duration_min, type: int, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableSchemaName: care
            baseTableName: specialist_slots
            baseColumnNames: specialist_id
            referencedTableSchemaName: care
            referencedTableName: specialists
            referencedColumnNames: id
            constraintName: fk_specialist_slots_specialist
            onDelete: CASCADE
        - addUniqueConstraint:
            schemaName: care
            tableName: specialist_slots
            columnNames: specialist_id, starts_at
            constraintName: uq_specialist_slots_start
        - sql:
            sql: ALTER TABLE care.specialist_slots ADD CONSTRAINT ck_specialist_slots_duration CHECK (duration_min BETWEEN 15 AND 240)
      rollback:
        - dropTable: { schemaName: care, tableName: specialist_slots }
