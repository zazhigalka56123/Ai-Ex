databaseChangeLog:
  - changeSet:
      id: 010-001-create-notifications
      author: notification
      preConditions:
        # Базы, поднятые до перехода на Liquibase, уже содержат таблицу из schema.sql.
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: notifications
      changes:
        - createTable:
            tableName: notifications
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, primaryKeyName: pk_notifications } }
              - column: { name: event_id, type: uuid, constraints: { nullable: false, unique: true, uniqueConstraintName: uq_notifications_event } }
              - column: { name: recipient_id, type: uuid, constraints: { nullable: false } }
              - column: { name: type, type: varchar(48), constraints: { nullable: false } }
              - column: { name: payload, type: text, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: status, type: varchar(24), constraints: { nullable: false } }
              - column: { name: attempts, type: int, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: sent_at, type: timestamptz }
        - sql:
            sql: >-
              ALTER TABLE notifications
                ADD CONSTRAINT ck_notification_type CHECK (type IN ('IMPORT_PARSED', 'IMPORT_FAILED', 'PERSONA_READY',
                  'PERSONA_ARCHIVED', 'CONSULTATION_REQUESTED', 'CONSULTATION_STATUS_CHANGED', 'FLAG_RESOLVED')),
                ADD CONSTRAINT ck_notification_status CHECK (status IN ('PENDING', 'SENT', 'FAILED')),
                ADD CONSTRAINT ck_notification_attempts CHECK (attempts >= 0),
                ADD CONSTRAINT ck_notification_sent CHECK ((status = 'SENT') = (sent_at IS NOT NULL))
        - sql:
            sql: CREATE INDEX ix_notifications_recipient_created ON notifications (recipient_id, created_at DESC, id DESC)
      rollback:
        - dropTable: { tableName: notifications }
