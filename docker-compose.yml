name: ai-ex-lab2

services:
  core-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: core
      POSTGRES_USER: core
      POSTGRES_PASSWORD: ${CORE_DATABASE_PASSWORD:-core}
    volumes:
      - core-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core -d core"]
      interval: 5s
      timeout: 3s
      retries: 20

  iam-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: iam
      POSTGRES_USER: iam
      POSTGRES_PASSWORD: ${IAM_DATABASE_PASSWORD:-iam}
    volumes:
      - iam-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iam -d iam"]
      interval: 5s
      timeout: 3s
      retries: 20

  notification-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: ${NOTIFICATION_DATABASE_PASSWORD:-notification}
    volumes:
      - notification-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notification"]
      interval: 5s
      timeout: 3s
      retries: 20

  config-server:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: config-server
    environment:
      JAVA_OPTS: ${JAVA_OPTS:--Xmx192m -XX:MaxMetaspaceSize=256m -XX:ActiveProcessorCount=2 -XX:+UseSerialGC}
      EUREKA_URL: http://discovery-server:8761/eureka/
      CONFIG_REPOSITORY: file:/config-repository
    volumes:
      - ./config-repository:/config-repository:ro
    ports:
      - "127.0.0.1:8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 30

  discovery-server:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: discovery-server
    environment:
      JAVA_OPTS: ${JAVA_OPTS:--Xmx192m -XX:MaxMetaspaceSize=256m -XX:ActiveProcessorCount=2 -XX:+UseSerialGC}
      EUREKA_URL: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
    ports:
      - "127.0.0.1:8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 30

  iam-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: iam-service
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 bytes)}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx192m -XX:MaxMetaspaceSize=256m -XX:ActiveProcessorCount=2 -XX:+UseSerialGC}
      EUREKA_URL: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      AIEX_LIQUIBASE_CONTEXTS: ${AIEX_LIQUIBASE_CONTEXTS:-demo}
      IAM_DATABASE_URL: jdbc:postgresql://iam-db:5432/iam
      IAM_DATABASE_USER: iam
      IAM_DATABASE_PASSWORD: ${IAM_DATABASE_PASSWORD:-iam}
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      iam-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 30

  notification-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: notification-service
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 bytes)}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx192m -XX:MaxMetaspaceSize=256m -XX:ActiveProcessorCount=2 -XX:+UseSerialGC}
      EUREKA_URL: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      NOTIFICATION_DATABASE_URL: r2dbc:postgresql://notification-db:5432/notification
      NOTIFICATION_DATABASE_USER: notification
      NOTIFICATION_DATABASE_PASSWORD: ${NOTIFICATION_DATABASE_PASSWORD:-notification}
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      notification-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 30

  core-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: app
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 bytes)}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx192m -XX:MaxMetaspaceSize=256m -XX:ActiveProcessorCount=2 -XX:+UseSerialGC}
      EUREKA_URL: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      AIEX_LIQUIBASE_CONTEXTS: ${AIEX_LIQUIBASE_CONTEXTS:-demo}
      CORE_DATABASE_URL: jdbc:postgresql://core-db:5432/core
      CORE_DATABASE_USER: core
      CORE_DATABASE_PASSWORD: ${CORE_DATABASE_PASSWORD:-core}
      AIEX_LLM_PROVIDER: ${AIEX_LLM_PROVIDER:-stub}
      AIEX_LLM_API_KEY: ${AIEX_LLM_API_KEY:-}
      AIEX_LLM_BASE_URL: ${AIEX_LLM_BASE_URL:-}
      AIEX_LLM_MODEL: ${AIEX_LLM_MODEL:-}
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      core-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 30

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: gateway
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 bytes)}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx192m -XX:MaxMetaspaceSize=256m -XX:ActiveProcessorCount=2 -XX:+UseSerialGC}
      EUREKA_URL: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 30

volumes:
  core-data:
  iam-data:
  notification-data:
